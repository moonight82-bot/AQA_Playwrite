name: Playwright Tests in Docker

on:
  push:
    branches: [main, Playwrite_1br]
  pull_request:
    branches: [main, Playwrite_1br]
  workflow_dispatch:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --init --ipc=host

    env:
      BASE_URL: ${{ secrets.BASE_URL }}
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      HTTP_USERNAME: ${{ secrets.HTTP_USERNAME }}
      HTTP_PASSWORD: ${{ secrets.HTTP_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my2-playwright-tests .

      - name: Run Playwright tests in Docker
        run: |
          docker run --rm --init --ipc=host \
            -e BASE_URL="${BASE_URL}" \
            -e USER_EMAIL="${USER_EMAIL}" \
            -e USER_PASSWORD="${USER_PASSWORD}" \
            -e HTTP_USERNAME="${HTTP_USERNAME}" \
            -e HTTP_PASSWORD="${HTTP_PASSWORD}" \
            -v "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            my2-playwright-tests
      
      - name: Show files after tests
        if: always()
        run: |
          pwd
          ls -la
          ls -la playwright-report || true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: warn
          retention-days: 7